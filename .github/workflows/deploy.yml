name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Skip until the Cloudflare token is added
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::Add a CLOUDFLARE_API_TOKEN repository secret to enable deploys."

      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != ''

      # the site is a single static page; publish only that, not the README or workflow files
      - name: Collect site files
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: mkdir dist && cp index.html dist/

      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 33226fdd5cfe5eddf76a8480c56cbba6
          command: pages deploy dist --project-name=tesla-roadster --branch=main --commit-hash=${{ github.sha }}
